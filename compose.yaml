services:
  api:
    build:
      context: .
      target: development
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgres://postgres:postgres@db:5432/property_scraper
      AUTH_KEY: ${AUTH_KEY:?Set AUTH_KEY in .env}
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - api_node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy

  db:
    # Same PostgreSQL major/data directory layout as postgres:17-alpine, with
    # PostGIS included, so the existing named volume is retained in place.
    image: postgis/postgis:17-3.5
    # postgis/postgis currently publishes amd64 images only. Docker Desktop
    # transparently emulates this on Apple Silicon.
    platform: linux/amd64
    environment:
      POSTGRES_DB: property_scraper
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d property_scraper"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  api_node_modules:
  postgres_data:
