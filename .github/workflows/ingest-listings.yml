name: Ingest listings

# Manual runs only. The five-minute schedule is the deployment user's cron
# entry on the Hetzner VM (deploy/refresh-listings.sh). GitHub's */5 cron is
# best-effort and was skipping almost every run.
on:
  workflow_dispatch:

concurrency:
  group: listing-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Configure deployment SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.HETZNER_VM_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.HETZNER_VM_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/hetzner_deploy"
          chmod 600 "$HOME/.ssh/hetzner_deploy"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/hetzner_deploy" >/dev/null

      - name: Refresh fast listing catalogues
        env:
          DEPLOY_HOST: ${{ secrets.HETZNER_VM_HOST }}
          DEPLOY_USER: ${{ secrets.HETZNER_VM_USER }}
        run: |
          ssh -T -i "$HOME/.ssh/hetzner_deploy" \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "/bin/sh /opt/property-scraper/refresh-listings.sh"
